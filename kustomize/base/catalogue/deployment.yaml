apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  labels:
    app: catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      nodeSelector:
        node-role: app

      # affinity:
      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #     - labelSelector:
      #         matchLabels:
      #           app: catalogue
      #       topologyKey: kubernetes.io/hostname

      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Mongo..."
              until nc -z mongo-headless 27017 >/dev/null 2>&1; do
                echo "Mongo not ready, retrying..."
                sleep 2
              done
              echo "Mongo is ready!"

      containers:
        - name: catalogue
          image: robotshop/rs-catalogue:2.1.0
          ports:
            - containerPort: 8080
          env:
            - name: INSTANA_DISABLED
              value: "true"
            - name: MONGODB_HOST
              value: mongo-headless
          resources:
            requests:
              cpu: "400m"
              memory: "128Mi"
            limits:
              cpu: "800m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
spec:
  selector:
    app: catalogue
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
