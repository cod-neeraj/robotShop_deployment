apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      nodeSelector:
        node-role: db

      # affinity:
      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       - labelSelector:
      #           matchLabels:
      #             app: mysql
      #         topologyKey: kubernetes.io/hostname
      containers:
        - name: mysql
          image: robotshop/rs-mysql-db:2.1.0
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
              subPath: mysql 
          
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        storageClassName: gp2 
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi