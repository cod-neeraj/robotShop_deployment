apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-dep
  labels:
    app: catalogue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      nodeSelector:
        node-role: service

      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Mongo..."
              until nc -z mongodb 27017 >/dev/null 2>&1; do
                echo "Mongo not ready, retrying..."
                sleep 2
              done
              echo "Mongo is ready!"

      containers:
        - name: catalogue
          image: robotshop/rs-catalogue:2.1.0
          ports:
            - containerPort: 8080
          env:
            - name: INSTANA_DISABLED
              value: "true"
            - name: MONGODB_HOST
              value: mongo-headless

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
spec:
  selector:
    app: catalogue
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
