apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dp
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        node-role: service

      initContainers:
       - name: wait-for-catalogue
         image: busybox:1.36
         command:
           - sh
           - -c
            - |
                echo "Waiting for catalogue..."
                until wget -qO- http://catalogue:8080/health; do
                 sleep 2
                done
                echo "Catalogue ready!"
        #  command:
        #    - sh
        #    - -c
        #    - |
        #      for svc in catalogue user cart shipping payment ratings; do
        #         echo "Waiting for $svc..."
        #         until nc -z $svc 8080; do
        #           sleep 2
        #         done
        #      done
        #      echo "All dependencies ready!"


      containers:
        - name: web
          image: robotshop/rs-web:2.1.0
          ports:
            - containerPort: 8080
          env:
          - name: INSTANA_DISABLED
            value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
spec:
  selector:
    app: web
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081