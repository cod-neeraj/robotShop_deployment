apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo-headless
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      nodeSelector:
         workload: db 
      # tolerations:
      #   - key: "workload"
      #     operator: "Equal"
      #     value: "neeraj"
      #     effect: "NoSchedule"

      # affinity:
      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       - labelSelector:
      #           matchLabels:
      #             app: mongo
      #         topologyKey: kubernetes.io/hostname
      containers:
        - name: mongo
          image: robotshop/rs-mongodb:2.1.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc  
