apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-mysql
  namespace: robot-shop
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: user
    - podSelector:
        matchLabels:
          app: shipping
    - podSelector:
        matchLabels:
          app: ratings
    ports:
    - protocol: TCP
      port: 3306